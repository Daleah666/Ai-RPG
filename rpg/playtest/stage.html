<title>Oops Playtest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed stage in the Duet Stage manner. Left sprite = you, right sprite = them, both hugging one
   dialogue column in the middle; each has a HUD on its outer edge. Deliberately a single dark look. */
:root{color-scheme:dark;
--ground:#0b0d12;--panel:#12151c;--panel2:#171b24;--box:rgba(15,17,24,.80);--box2:rgba(15,17,24,.93);
--glass:rgba(255,255,255,.05);--glass2:rgba(255,255,255,.09);--edge:rgba(255,255,255,.13);--edge2:rgba(255,255,255,.26);
--text:#f6f8fb;--muted:rgba(232,238,247,.76);--faint:rgba(232,238,247,.5);
--pink:#ff7cbf;--pink-ink:#22091a;--cyan:#86e3ef;--gold:#f6c66d;--mint:#8be6c9;--lime:#c9f07a;--violet:#b9a3ff;--crit:#ff6b6b;
--miss:rgba(232,238,247,.14);--ink:#130a10;
--f-head:"Unbounded",system-ui,sans-serif;--f-body:"Instrument Sans",system-ui,sans-serif;--f-serif:"Instrument Serif",Georgia,serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace;
--lc:var(--lime);--rc:var(--pink);--col:500px;--hudL:224px;--hudR:224px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden}
button,select,input{font:inherit}
button{font-weight:600;color:var(--text);background:var(--glass2);border:1px solid var(--edge2);border-radius:999px;padding:7px 14px;cursor:pointer}
button:hover{border-color:rgba(255,255,255,.42)}
button:disabled{opacity:.42;cursor:default}
button.primary{background:var(--pink);color:var(--pink-ink);border-color:transparent}
button.quiet{background:none;border-color:var(--edge);font-weight:500}
button.sm{padding:4px 11px;font-size:.76rem}
select,input[type=text]{color:var(--text);background:var(--ground);border:1px solid var(--edge2);border-radius:10px;padding:6px 9px;min-width:0;max-width:100%}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.lbl{font-family:var(--f-mono);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0;font-weight:500}

/* ---------- stage ---------- */
.stage{position:relative;height:100%;overflow:hidden;isolation:isolate}
.scene{position:absolute;inset:0;z-index:-3;background:
 radial-gradient(46% 60% at 86% 100%,color-mix(in srgb,var(--rc) 24%,transparent),transparent 70%),
 radial-gradient(44% 58% at 12% 100%,color-mix(in srgb,var(--lc) 15%,transparent),transparent 70%),
 radial-gradient(70% 50% at 50% 0%,#151a26,transparent 70%),var(--ground)}
.scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.4;transition:opacity .6s ease}
.scene::after{content:"";position:absolute;inset:auto 0 0;height:30%;background:linear-gradient(transparent,rgba(11,13,18,.75))}
/* sprites hug the dialogue column: each fills the space from its screen edge to just inside the column */
.sprite{position:absolute;bottom:0;z-index:-2;height:97%;margin:0;display:flex;align-items:flex-end;pointer-events:none;transition:filter .4s,transform .4s;transform-origin:50% 100%}
/* each sprite owns the lane between its HUD and the chat, and leans a little way in behind the chat */
.sprite.l{left:calc(var(--hudL) - 6px);right:calc(50% + var(--col)/2 - 104px);justify-content:flex-end}
.sprite.r{right:calc(var(--hudR) - 6px);left:calc(50% + var(--col)/2 - 104px);justify-content:flex-start}
.sprite img,.sprite video{display:block;max-width:100%;max-height:100%;object-fit:contain;object-position:center bottom}
.sprite img{filter:drop-shadow(0 22px 38px rgba(0,0,0,.6))}
.sprite video.keyed{mix-blend-mode:screen}
.sprite .boxed{max-height:74%;border-radius:26px 26px 0 0;-webkit-mask-image:linear-gradient(#000 64%,transparent);mask-image:linear-gradient(#000 64%,transparent)}
.sprite.dim{filter:brightness(.55) saturate(.75);transform:translateY(8px) scale(.985)}
.sprite.hit{animation:e-shake .5s ease-in-out}
.sprite.hop{animation:e-hop .7s ease-out}
@keyframes e-shake{20%,60%{translate:-9px 0}40%,80%{translate:9px 0}}
@keyframes e-hop{30%{translate:0 -20px}60%{translate:0 0}80%{translate:0 -7px}}
body.sway .sprite>*{animation:breathe 4.8s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-6px)}}

/* floating numbers over a sprite when something lands */
.pop{position:absolute;z-index:4;bottom:52%;font-family:var(--f-head);font-weight:700;font-size:clamp(1.3rem,2.6vw,2.2rem);color:var(--k,#fff);text-shadow:0 2px 14px rgba(0,0,0,.7),0 0 18px color-mix(in srgb,var(--k,#fff) 55%,transparent);pointer-events:none;white-space:nowrap;animation:pop 1.5s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,14px) scale(.5) rotate(-8deg)}14%{opacity:1;transform:translate(-50%,0) scale(1.18) rotate(3deg)}30%{transform:translate(-50%,-6px) scale(1)}100%{opacity:0;transform:translate(-50%,-80px) scale(1.04)}}
.bar .t b.tick{animation:tick .5s ease-out}
@keyframes tick{30%{color:var(--gold);transform:scale(1.18)}}

/* ---------- HUDs ---------- */
.hud{position:absolute;top:12px;z-index:3;max-height:calc(100% - 24px);overflow:auto;scrollbar-width:thin;display:grid;grid-template-columns:minmax(0,1fr);gap:9px;padding:12px;border-radius:18px;background:var(--box);border:1px solid color-mix(in srgb,var(--c) 38%,var(--edge));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.hud.l{left:max(12px,env(safe-area-inset-left,0px));--c:var(--lc);width:var(--hudL)}
.hud.r{right:max(12px,env(safe-area-inset-right,0px));--c:var(--rc);width:var(--hudR)}
/* drag a panel's inner edge to make it wider or narrower */
.grip{position:absolute;top:10%;bottom:10%;width:14px;z-index:5;cursor:ew-resize;touch-action:none}
.grip::after{content:"";position:absolute;left:5px;top:50%;width:4px;height:56px;margin-top:-28px;border-radius:4px;background:var(--edge2);transition:background .15s,height .15s,margin .15s}
.grip:hover::after,.grip.on::after,.grip:focus-visible::after{background:var(--c);height:96px;margin-top:-48px}
.grip.l{left:calc(max(12px,env(safe-area-inset-left,0px)) + var(--hudL) - 5px);--c:var(--lc)}
.grip.r{right:calc(max(12px,env(safe-area-inset-right,0px)) + var(--hudR) - 5px);--c:var(--rc)}
.emo{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:10px;background:color-mix(in srgb,var(--c) 10%,transparent);border:1px solid color-mix(in srgb,var(--c) 32%,var(--edge))}
.emo .g{font-size:1rem;color:var(--c);line-height:1;width:1.1em;text-align:center}
.emo b{font-size:.8rem;font-weight:600;white-space:nowrap}
.emo small{font-family:var(--f-mono);font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.emo .mb{flex:1;display:flex;gap:2px;min-width:40px}
.emo .mb i{flex:1;height:5px;border-radius:2px;background:var(--glass2)}
.emo .mb i.on{background:linear-gradient(90deg,var(--c),var(--gold))}
.foe{position:absolute;z-index:3;top:14px;left:calc(50% + var(--col)/2 + 12px);right:calc(var(--hudR) + 26px);padding:8px 10px;border-radius:12px;background:var(--box);border:1px solid color-mix(in srgb,var(--crit) 50%,var(--edge2));backdrop-filter:blur(10px)}
.foe b{display:block;font-family:var(--f-head);font-size:.86rem;line-height:1.15}
.foe small{font-family:var(--f-mono);font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.foe .track{margin-top:5px}
.roster{display:grid;gap:7px}
.roster .r{display:grid;gap:3px;padding:6px 8px;border-radius:9px;background:var(--glass);border:1px solid var(--edge)}
.roster .r.out{opacity:.45}
.roster .r.aim{border-color:color-mix(in srgb,var(--c) 70%,transparent)}
.roster .r .h{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;font-weight:600}
.roster .r .h span{font-family:var(--f-mono);font-size:.56rem;font-weight:400;color:var(--muted);white-space:nowrap}
.roster .track{height:5px}
.roster .chips{margin:0}
.windup{padding:7px 9px;border-radius:9px;font-size:.76rem;line-height:1.35;background:color-mix(in srgb,var(--crit) 14%,transparent);border:1px solid color-mix(in srgb,var(--crit) 50%,transparent)}
.windup b{display:block;font-family:var(--f-mono);font-size:.54rem;letter-spacing:.12em;text-transform:uppercase;color:var(--crit)}
.turn{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--crit)}
#rowsBattle{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.route{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.route li{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.8rem;color:var(--muted);position:relative;padding:3px 0}
.route li::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--edge2);justify-self:center}
.route li+li::after{content:"";position:absolute;left:6px;top:-7px;width:2px;height:10px;background:var(--edge2)}
.route li.here{color:var(--text);font-weight:600}
.route li.here::before{background:var(--c);border-color:var(--c);box-shadow:0 0 10px var(--c)}
.route li small{display:block;font-weight:400;font-size:.68rem;color:var(--faint)}
.route button{padding:2px 9px;font-size:.7rem}
.mode{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;font-weight:500;background:var(--box);border-color:color-mix(in srgb,var(--k) 60%,transparent);color:var(--k)}
.mode::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--k);box-shadow:0 0 10px var(--k)}
.mode[data-mode="travel"]{--k:var(--mint)}
.mode[data-mode="combat"]{--k:var(--crit)}
.mode[data-mode="combat"]::before{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}
body.combat .scene{box-shadow:inset 0 0 160px -40px color-mix(in srgb,var(--crit) 55%,transparent)}
body.combat .composer{border-color:color-mix(in srgb,var(--crit) 55%,var(--edge2))}
.hud h2{margin:0;font-family:var(--f-head);font-weight:500;font-size:1.02rem;line-height:1.15;overflow-wrap:anywhere}
.hud .role{margin:0;font-family:var(--f-serif);font-style:italic;font-size:1.02rem;color:var(--c);line-height:1.2}
.hud .who{display:grid;gap:1px}
.dial{position:relative;display:grid;justify-items:center}
.dial svg{width:100%;max-width:190px;height:auto;display:block}
.dial .num{position:absolute;bottom:0;display:grid;justify-items:center;line-height:1.05}
.dial .num b{font-family:var(--f-head);font-weight:700;font-size:1.55rem;font-variant-numeric:tabular-nums}
.dial .num span{font-family:var(--f-serif);font-style:italic;color:var(--c);font-size:.98rem}
.hud input[type=range]{width:100%;accent-color:var(--lime);margin:0}
.bars{display:grid;gap:6px}
.bar{display:grid;gap:2px}
.bar .t{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:.56rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.bar .t b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.track{position:relative;height:8px;border-radius:999px;background:var(--glass2);overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--k);transition:width .4s;box-shadow:0 0 10px -2px var(--k)}
.track u{position:absolute;top:0;bottom:0;width:2px;background:var(--ground)}
.attrs{display:grid;gap:3px}
.attrs div{display:grid;grid-template-columns:74px minmax(0,1fr) 38px;gap:6px;align-items:center;font-size:.74rem}
.attrs span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attrs i{display:block;height:5px;border-radius:999px;background:var(--glass2);overflow:hidden}
.attrs i em{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--c),var(--gold))}
.attrs i em.cut{background:var(--crit)}
.attrs b{font-family:var(--f-mono);font-weight:500;font-size:.68rem;text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips span{font-family:var(--f-mono);font-size:.56rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid color-mix(in srgb,var(--k,var(--c)) 55%,transparent);color:color-mix(in srgb,var(--k,var(--c)) 75%,var(--text))}
.hud .set{display:grid;gap:5px;padding-top:8px;border-top:1px solid var(--edge)}
.hud .set label{display:grid;gap:2px}
.hud .set select,.hud .set input{font-size:.8rem;padding:4px 7px;width:100%}
.hud .grok{font-size:.72rem;color:var(--faint);margin:0}
.over{display:grid;grid-template-columns:minmax(0,1fr);gap:7px;padding-top:9px;border-top:1px solid var(--edge)}
.over h3{margin:0;font-family:var(--f-mono);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--c);font-weight:500}
.over p{margin:0;font-size:.8rem;color:var(--muted);line-height:1.42}
.over p b{color:var(--text);font-weight:600}
.over .quote{font-family:var(--f-serif);font-style:italic;font-size:1.02rem;color:var(--text)}
.over ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.over li{font-size:.78rem;color:var(--muted);line-height:1.38}
.over li b{display:block;color:var(--text);font-weight:600}
.more{font-family:var(--f-mono);font-size:.54rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-align:center;margin:0}

/* ---------- dialogue column ---------- */
.dialog{position:relative;margin:0 auto;width:min(var(--col),100%);height:100%;display:flex;flex-direction:column;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:none}
.top .title{flex:1;min-width:120px;display:grid;line-height:1.15}
.top .title b{font-family:var(--f-head);font-weight:300;font-size:.95rem;letter-spacing:-.01em}
.tabs{display:inline-flex;gap:2px;padding:2px;border-radius:999px;background:var(--box);border:1px solid var(--edge)}
.tabs button{border:0;background:none;color:var(--muted);padding:5px 12px;font-size:.78rem}
.tabs button[aria-selected="true"]{background:var(--text);color:var(--ground)}
.panel{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-content:start;padding:6px 2px 10px}
.panel h2{margin:6px 0 0;font-family:var(--f-head);font-weight:500;font-size:1.05rem}
.panel p{margin:0;color:var(--muted);font-size:.9rem;max-width:64ch}
.quest{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:11px 13px;border-radius:14px;background:var(--box);border:1px solid var(--edge);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.quest.done{opacity:.6}
.quest b{font-weight:600}
.quest small{grid-column:1;color:var(--muted);font-size:.82rem}
.quest .meta{grid-column:1;display:flex;flex-wrap:wrap;gap:4px}
.quest .meta span{font-family:var(--f-mono);font-size:.54rem;letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border-radius:999px;border:1px solid var(--edge);color:var(--faint)}
.quest .meta span.ok{color:var(--mint);border-color:color-mix(in srgb,var(--mint) 50%,transparent)}
.quest button{grid-column:2;grid-row:1/4}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:8px;counter-reset:step}
.steps li{counter-increment:step;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px 12px;border-radius:14px;background:var(--box);border:1px solid var(--edge);font-size:.9rem;color:var(--muted)}
.steps li::before{content:counter(step);font-family:var(--f-head);font-size:.8rem;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--pink);color:var(--pink-ink)}
.steps li b{color:var(--text)}
.steps code,.panel code{font-family:var(--f-mono);font-size:.82em;color:var(--cyan);overflow-wrap:anywhere}
.copybox{font-family:var(--f-mono);font-size:.74rem;line-height:1.5;white-space:pre-wrap;padding:10px 12px;border-radius:12px;background:var(--ground);border:1px solid var(--edge2);color:var(--muted);max-height:180px;overflow:auto;margin:0}
.top .title span{font-family:var(--f-mono);font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.log{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:18px;padding:34px 2px 10px;scrollbar-width:thin;-webkit-mask-image:linear-gradient(transparent,#000 34px);mask-image:linear-gradient(transparent,#000 34px)}
.line{position:relative;max-width:88%;padding:20px 15px 12px;border-radius:16px;background:var(--box);border:1px solid color-mix(in srgb,var(--c) 32%,var(--edge));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);flex:none;display:grid;grid-template-columns:minmax(0,1fr);gap:9px}
.line.enter{animation:linein .36s cubic-bezier(.2,.9,.3,1.25)}
.line.me{align-self:flex-start;border-top-left-radius:6px;--c:var(--lc);background:color-mix(in srgb,var(--c) 8%,var(--box))}
.line.her{align-self:flex-end;border-top-right-radius:6px;--c:var(--rc)}
.line.sys{align-self:center;max-width:96%;--c:var(--gold)}
@keyframes linein{from{opacity:0;transform:translateY(10px) scale(.97)}}
.plate{position:absolute;top:-11px;left:14px;font-family:var(--f-head);font-weight:500;font-size:.68rem;padding:3px 10px;border-radius:8px;background:var(--c);color:var(--ink);max-width:76%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line.her .plate{left:auto;right:14px}
/* the beat: dice line, strip, then the paragraph set apart */
.dice{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin:0;overflow-wrap:anywhere}
.dice b{color:var(--k,var(--text));font-weight:500}
.say{font-family:var(--f-serif);font-size:1.24rem;line-height:1.4;margin:0;color:var(--text);text-wrap:pretty}
.say.spoken{font-family:var(--f-body);font-size:1rem;line-height:1.5}
.strip{position:relative;padding-top:15px}
.bands{display:flex;height:16px;border-radius:6px;overflow:hidden;border:1px solid var(--edge2)}
.bands span{min-width:0}
.bands span+span{border-left:1px solid var(--ground)}
.o-crit{background:var(--crit)}.o-hit{background:var(--gold)}.o-bounce{background:var(--cyan)}.o-miss{background:var(--miss)}.o-fumble{background:var(--pink)}.o-virtue{background:var(--mint)}.o-affliction{background:var(--violet)}
.mark{position:absolute;top:0;transform:translateX(-50%);display:grid;justify-items:center;pointer-events:none}
.mark b{font-family:var(--f-head);font-size:.6rem;background:var(--text);color:var(--ground);border-radius:5px;padding:0 5px;line-height:1.35}
.mark i{width:2px;height:20px;background:var(--text)}
.key{display:flex;flex-wrap:wrap;gap:4px 10px;font-family:var(--f-mono);font-size:.56rem;letter-spacing:.04em;color:var(--faint)}
.key span{display:inline-flex;align-items:center;gap:4px}
.key i{width:8px;height:8px;border-radius:2px}
.fx{display:flex;flex-wrap:wrap;gap:4px}
.fx span{font-family:var(--f-mono);font-size:.58rem;letter-spacing:.03em;padding:2px 8px;border-radius:999px;background:var(--glass2);color:var(--muted)}
.choices{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.choice{display:grid;gap:2px;text-align:left;border-radius:12px;padding:8px 11px;background:var(--glass);border:1px solid var(--edge2);font-weight:500}
.choice small{font-family:var(--f-mono);font-size:.54rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.choice em{font-style:normal;font-family:var(--f-head);font-size:.9rem;color:var(--gold)}

/* ---------- composer ---------- */
.composer{position:relative;flex:none;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:12px;border-radius:18px;background:var(--box2);border:1px solid color-mix(in srgb,var(--lc) 35%,var(--edge2));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.crow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#rowsCombat,#rowsTravel{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.crow .grow{flex:1 1 160px;min-width:0}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:999px;background:var(--glass2)}
.seg button{border:0;background:none;color:var(--muted);padding:6px 12px;font-size:.8rem}
.seg button[aria-pressed="true"]{background:var(--lime);color:var(--ink)}
.composer .why{margin:0;font-size:.76rem;color:var(--faint)}
.say-row input{flex:1 1 160px}

/* ---------- narrow screens: HUDs become two cards on top, sprites fade behind the chat ---------- */
/* ---- town layout: tabbed right panel, bubble map, button grids ---- */
.rtabs{display:flex;gap:2px;padding:2px;border-radius:10px;background:var(--glass2);position:sticky;top:-12px;z-index:2}
.rtabs button{flex:1;border:0;background:none;color:var(--muted);padding:5px 4px;font-size:.72rem;border-radius:8px;white-space:nowrap}
.rtabs button[aria-selected="true"]{background:var(--c);color:var(--ink)}
.map{display:block;width:100%;height:auto;border-radius:12px;background:var(--glass);border:1px solid var(--edge)}
.map line{stroke:var(--edge2);stroke-width:.8;stroke-dasharray:1.6 1.4}
.map line.on{stroke:var(--c);stroke-dasharray:none}
.map .node{cursor:pointer;outline:none}
.map .node circle{fill:var(--ground);stroke:var(--edge2);stroke-width:1;transition:fill .15s,stroke .15s}
.map .node text{paint-order:stroke;stroke:var(--ground);stroke-width:1.4px;stroke-linejoin:round;font-family:var(--f-mono);font-size:4.3px;fill:var(--muted);text-anchor:middle;letter-spacing:.04em;text-transform:uppercase;pointer-events:none}
.map .node text.q{stroke:none;font-size:5px;fill:var(--gold);font-weight:700}
.map .node .res{fill:var(--pink);stroke:none}
.map .node.near circle:first-child{stroke:var(--c)}
.map .node.near text{fill:var(--text)}
.map .node.here circle:first-child{fill:var(--c);stroke:var(--c);filter:drop-shadow(0 0 3px var(--c))}
.map .node.here text{fill:var(--c);font-weight:700}
.map .node.here text.q{fill:var(--ink)}
.map .node:hover circle:first-child,.map .node:focus-visible circle:first-child{stroke:var(--text);stroke-width:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.cell{display:grid;gap:1px;text-align:left;padding:7px 10px;border-radius:10px;line-height:1.2;min-height:44px;align-content:center}
.cell b{font-size:.8rem;font-weight:600}
.cell small{font-size:.62rem;color:var(--muted);font-weight:400}
.cell.primary small{color:color-mix(in srgb,var(--pink-ink) 75%,transparent)}
.cell.go{background:none;border-style:dashed}
.cell:disabled{opacity:.45}
.train{display:grid;gap:4px}
.train div{display:grid;grid-template-columns:minmax(0,1fr) auto 34px auto;gap:6px;align-items:center;font-size:.78rem}
.train b{font-family:var(--f-mono);font-size:.74rem;text-align:right}
.train small{font-family:var(--f-mono);font-size:.6rem;color:var(--gold)}
.moves{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.moves li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 8px;font-size:.78rem}
.moves li span{font-family:var(--f-mono);font-size:.58rem;color:var(--muted);white-space:nowrap}
.moves li small{grid-column:1/-1;font-size:.68rem;color:var(--faint);line-height:1.35}
.moves li.locked{opacity:.5}
.sprite .flip{scale:-1 1}
body:not(.debug) .dbg{display:none!important}
#gridTravel[hidden],#rowsBattle[hidden]{display:none!important}
/* ---- v7: dice tray, debugger, calmer chat, bubbles, clock ---- */
.tray{flex:none;display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding:8px 12px 7px;border-radius:14px;background:var(--box2);border:1px solid color-mix(in srgb,var(--gold) 45%,var(--edge2));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tray-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tray-h .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tray .deg{font-family:var(--f-head);font-size:.78rem;letter-spacing:.06em;padding:1px 9px;border-radius:7px;color:var(--ink);opacity:0;transform:scale(.8);transition:opacity .25s,transform .25s}
.tray.land .deg{opacity:1;transform:none}
.tray .strip{padding-top:15px}
.tray .key{display:none}
.tray-m{margin:0;font-family:var(--f-mono);font-size:.6rem;color:var(--muted);overflow-wrap:anywhere}
.dbgtop{flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;max-height:24vh;overflow:auto;padding:8px;border-radius:12px;background:var(--box2);border:1px dashed color-mix(in srgb,var(--gold) 70%,transparent);font-family:var(--f-mono);font-size:.62rem;line-height:1.45;scrollbar-width:thin}
#jiggle.stuck{border-color:var(--gold);color:var(--gold);animation:wig .5s ease-in-out infinite alternate}
@keyframes wig{from{rotate:-3deg}to{rotate:3deg}}
@media (prefers-reduced-motion:reduce){#jiggle.stuck{animation:none}}
.simrow{margin:2px 0;font-family:var(--f-mono);font-size:.6rem;line-height:1.45;color:var(--muted);overflow-wrap:anywhere}
.dbgtop .dg{padding:6px 8px;border-radius:8px;background:var(--glass)}
.dbgtop h4{margin:0 0 3px;font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:500}
.dbgtop p{margin:0;color:var(--muted);overflow-wrap:anywhere}
.clock{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.thought{flex:none;display:grid;gap:1px;padding:5px 12px;border-left:2px solid var(--lc);margin-left:4px}
.thought i{font-family:var(--f-serif);font-size:.98rem;color:var(--muted)}
.scene img{transition:opacity .6s ease,filter 1.2s ease}
body[data-phase="Morning"] .scene img{filter:brightness(1.12) saturate(1.05)}
body[data-phase="Evening"] .scene img{filter:sepia(.35) saturate(1.2) brightness(.85)}
body[data-phase="Night"] .scene img{filter:brightness(.5) saturate(.7) hue-rotate(12deg)}
/* the chat: smaller cards, and plain captions for the narrator's bookkeeping */
.log{gap:13px}
.line{padding:16px 13px 10px;gap:6px;max-width:86%;background:color-mix(in srgb,var(--box) 82%,transparent)}
.say{font-size:1.04rem;line-height:1.42}
.say.spoken{font-size:.95rem}
.dice{font-size:.66rem}
.line.me{border-radius:6px 18px 18px 18px}
.line.her{border-radius:18px 6px 18px 18px}
.line.cap{align-self:stretch;max-width:100%;padding:5px 10px;background:none;border:0;border-left:2px solid color-mix(in srgb,var(--gold) 60%,transparent);border-radius:0;backdrop-filter:none;-webkit-backdrop-filter:none}
.line.cap .plate{display:none}
.line.cap .say{font-family:var(--f-body);font-size:.84rem;color:var(--muted)}
/* out of combat the buttons are bubbles; in a fight they stay square */
.cell.bubble{border-radius:20px;padding:7px 13px}
.cell.spot{border-color:color-mix(in srgb,var(--cyan) 60%,transparent);background:color-mix(in srgb,var(--cyan) 9%,transparent)}
.cell.look{border-color:color-mix(in srgb,var(--lime) 55%,transparent)}
.map .node.wild circle:first-child,.map .node.risky circle:first-child{stroke:var(--crit);stroke-dasharray:1.5 1}
.map .node.shut{opacity:.5}
.map .node .res.roam{fill:var(--gold)}
.map line.wild{stroke:color-mix(in srgb,var(--crit) 55%,transparent)}
.pot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.76rem}
.bio{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 9px;margin:0;font-size:.74rem}
.bio dt{font-family:var(--f-mono);font-size:.56rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding-top:2px}
.bio dd{margin:0;color:var(--muted)}
.hud textarea{width:100%;font-family:var(--f-mono);font-size:.6rem;border-radius:8px;background:var(--glass);color:var(--text);border:1px solid var(--edge2);padding:5px;resize:vertical}
@media (prefers-reduced-motion:reduce){.tray .deg,.scene img{transition:none}}
.map .node.door rect{fill:var(--glass2);stroke:var(--edge2);stroke-width:.8}
.map .node.door text{font-size:3.6px;fill:var(--text)}
.map .node.door.near rect{stroke:var(--c)}
.map .node.door:hover rect,.map .node.door:focus-visible rect{stroke:var(--text);stroke-width:1.4}
.dom{display:grid;gap:3px;padding:6px 8px;border-radius:9px;background:var(--glass);border:1px solid var(--edge)}
.dom.on{border-color:color-mix(in srgb,var(--c) 70%,transparent)}
.dom .h{display:flex;justify-content:space-between;gap:8px;font-size:.76rem}
.dom .h span{font-family:var(--f-mono);font-size:.54rem;color:var(--muted);white-space:nowrap}
.dom .track{height:5px}
/* ---- v9: the clean pass. One hairline, rationed colour, and a left panel that opens into her sheet when pulled wide ---- */
.top .title span{display:none}
.hud{border:1px solid var(--edge);border-radius:16px;background:color-mix(in srgb,var(--box) 90%,transparent);gap:10px;padding:14px 13px;container-type:inline-size}
.hud .over{border-top:1px solid var(--edge);padding-top:10px}
.emo{background:none;border:0;border-bottom:1px solid var(--edge);border-radius:0;padding:2px 0 9px}
.rtabs{position:sticky;top:-14px;z-index:2;display:flex;gap:2px;padding:0;border-radius:0;background:var(--box);border-bottom:1px solid var(--edge);overflow-x:auto;scrollbar-width:none}
.rtabs button{flex:none;border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--faint);padding:7px 8px 6px;font-family:var(--f-mono);font-weight:500;font-size:.6rem;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.rtabs button:hover{color:var(--muted)}
.rtabs button[aria-selected="true"]{background:none;color:var(--text);border-bottom-color:var(--c)}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheet-h h2{margin:0;font-family:var(--f-head);font-weight:700;font-size:1.02rem;line-height:1.05;letter-spacing:-.01em}
.sheet-h .role{margin:3px 0 0;font-family:var(--f-serif);font-style:italic;font-size:1.05rem;color:var(--pink);line-height:1.2}
.sheet-h .lv{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--text);color:var(--ground);font-family:var(--f-head);font-weight:700;font-size:.82rem;box-shadow:0 0 0 2px var(--pink)}
.range{display:grid;gap:3px}
.range .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.8rem;font-weight:600}
.range .t span:first-child{color:var(--pink)}
.range .t span:last-child{color:var(--gold)}
.range .t b{font-family:var(--f-head);font-size:1.25rem;font-variant-numeric:tabular-nums}
#gauge{-webkit-appearance:none;appearance:none;display:block;width:100%;height:8px;margin:5px 0 3px;padding:0;border:0;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--gold))}
#gauge::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:6px;height:20px;border-radius:3px;background:#fff;box-shadow:0 0 0 2px var(--ground);cursor:ew-resize}
#gauge::-moz-range-thumb{width:6px;height:20px;border:0;border-radius:3px;background:#fff;box-shadow:0 0 0 2px var(--ground);cursor:ew-resize}
#gauge:disabled{opacity:.65}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:0 18px}
.fcell{display:grid;gap:1px;padding:7px 0 8px;border-bottom:1px solid var(--edge);min-width:0}
.fcell span{font-family:var(--f-mono);font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.fcell b{font-weight:500;font-size:.94rem;line-height:1.3;overflow-wrap:anywhere}
.abox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.abox div{display:grid;justify-items:center;padding:8px 2px 7px;border-radius:12px;border:1px solid var(--edge);background:var(--glass);min-width:0}
.abox span{max-width:100%;font-family:var(--f-mono);font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.abox b{font-family:var(--f-head);font-weight:700;font-size:1.02rem;line-height:1.25;font-variant-numeric:tabular-nums}
.abox small{font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums}
.abox .cut b{color:var(--crit)}
.mcard{display:grid;gap:5px;padding:10px 12px;border-radius:14px;border:1px solid color-mix(in srgb,var(--pink) 28%,var(--edge));background:color-mix(in srgb,var(--pink) 5%,transparent)}
.mcard b{font-size:.92rem;line-height:1.25}
.mcard b i{font-style:normal;color:var(--gold);font-size:.56rem;letter-spacing:.14em;vertical-align:middle;margin-left:4px}
.mcard p{margin:0;font-size:.8rem;color:var(--muted);line-height:1.4}
.mcard .chips span{--k:var(--pink)}
.hud p{margin:0;font-size:.8rem;color:var(--muted);line-height:1.45}
.hud p.lbl,.hud .lbl{font-size:.56rem;color:var(--faint)}
/* pulled wide, the panel becomes the sheet: two columns of fields, six attribute boxes, bars side by side */
@container (min-width:290px){
  .sheet-h h2{font-size:2rem}
  .sheet-h .role{font-size:1.3rem}
  .sheet-h .lv{width:42px;height:42px;font-size:.95rem}
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .abox{grid-template-columns:repeat(6,minmax(0,1fr))}
  .hud .bars{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px}
  .fcell b{font-size:1.02rem}
  .rtabs button{font-size:.66rem;padding:8px 10px 7px}
  .bio{grid-template-columns:5.5rem minmax(0,1fr)}
}
@container (min-width:460px){.abox b{font-size:1.3rem}.abox div{padding:11px 4px 9px}.abox span{font-size:.56rem}}
/* the picture: full height, feet on the floor, one soft shadow, nothing framing it */
.sprite{height:100%}
.sprite img,.sprite video{height:100%;width:auto;max-width:100%;max-height:100%;object-fit:contain;object-position:center bottom}
.sprite .boxed{height:auto}
.sprite img{filter:drop-shadow(0 30px 40px rgba(0,0,0,.6))}
body.sway .sprite>*{animation:breathe9 5.5s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe9{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.012) scaleX(1.004)}}
.scene::after{height:38%;background:linear-gradient(transparent,rgba(11,13,18,.8))}
/* the middle column: quieter boxes */
.composer{border-color:var(--edge2)}
.tray{border-color:var(--edge2);padding:7px 12px 6px}
.cell.bubble{background:var(--glass);border-color:var(--edge)}
.cell.bubble.primary{background:var(--pink);border-color:transparent}
.cell.spot{background:var(--glass);border-color:color-mix(in srgb,var(--cyan) 45%,var(--edge))}
.cell.look{border-color:var(--edge)}
.exits{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding-top:6px;border-top:1px solid var(--edge)}
.exits .lbl{margin-right:2px}
.exits button{padding:4px 11px;font-size:.74rem;font-weight:500;background:none;border-color:var(--edge)}
.exits button small{color:var(--faint);font-weight:400;margin-left:5px}
.exits button:hover{border-color:var(--edge2)}
@media (prefers-reduced-motion:reduce){body.sway .sprite>*{animation:none}}
.hud p.more{font-size:.54rem}
.sheet,.sheet-body{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0}
.sheet-pic{display:none;margin:0}
@container (min-width:520px){
  
  .sheet-pic{display:block;position:sticky;top:0;height:calc(100vh - 56px);border-right:1px solid var(--edge);padding-right:10px;overflow:hidden}
  .sheet-pic>img,.sheet-pic>video{display:block;width:100%;height:100%;object-fit:cover;object-position:center top;filter:drop-shadow(0 24px 34px rgba(0,0,0,.6))}
  .sheet-pic>video{mix-blend-mode:screen}
  .sheet-pic .flip{scale:-1 1}
  .sheet-pic figcaption{position:absolute;left:4px;bottom:8px;font-family:var(--f-head);font-weight:700;font-size:1.9rem;line-height:1;text-shadow:0 2px 16px rgba(0,0,0,.8)}
  .sheet-body .sheet-h h2{font-size:2.3rem}
}
:root{--picL:calc(var(--hudL) * .44)}
.sprite.l,.sprite.r{transition:left .5s cubic-bezier(.2,.8,.2,1),right .5s cubic-bezier(.2,.8,.2,1),filter .4s,transform .4s}
.hud.l{transition:left .5s cubic-bezier(.2,.8,.2,1),width .5s cubic-bezier(.2,.8,.2,1)}
.dialog{transition:margin-left .5s cubic-bezier(.2,.8,.2,1)}
body.dragging .sprite,body.dragging .hud,body.dragging .dialog{transition:none}
@media (min-width:901px){
}
.quick{display:flex;flex-wrap:wrap;gap:4px 16px}
.hud p.quick{font-size:.86rem}
.quick b{font-family:var(--f-head);color:var(--text);font-size:.95rem;font-variant-numeric:tabular-nums}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pills span{padding:4px 11px;border-radius:999px;border:1px solid color-mix(in srgb,var(--cyan) 35%,var(--edge));background:color-mix(in srgb,var(--cyan) 7%,transparent);font-size:.8rem}
.pills.gear span{border-color:color-mix(in srgb,var(--gold) 40%,var(--edge));background:color-mix(in srgb,var(--gold) 6%,transparent)}
.feats{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.feats li{position:relative;padding-left:20px;font-size:.84rem;color:var(--muted);line-height:1.4}
.feats li::before{content:"✦";position:absolute;left:0;color:var(--faint)}
.feats li b{color:var(--text)}
.rtabs.under{position:static;margin-top:8px;border-top:1px solid var(--edge)}
.mcard b i{font-family:var(--f-mono);text-transform:uppercase}
@media (prefers-reduced-motion:reduce){.sprite.l,.sprite.r,.hud.l,.dialog{transition:none}}
@media (min-width:901px){
  .dialog{margin:0;margin-left:max(calc(var(--hudL) + 64px),calc(50% - var(--col) / 2));width:min(var(--col),calc(100% - max(calc(var(--hudL) + 64px),calc(50% - var(--col) / 2)) - var(--hudR) - 30px))}
  .sprite.r{left:calc(max(calc(var(--hudL) + 64px),calc(50% - var(--col) / 2)) + var(--col) - 104px)}
}
.vitals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 12px}
.vitals .track{height:5px}
.boxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:5px}
.box{display:grid;align-content:start;gap:1px;padding:7px 9px 8px;border-radius:10px;border:1px solid var(--edge);background:var(--glass);min-width:0}
.box.wide{grid-column:span 2}
.box span{font-family:var(--f-mono);font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.box b{font-weight:600;font-size:.86rem;line-height:1.25;overflow-wrap:anywhere}
.box small{font-size:.68rem;color:var(--muted);line-height:1.3}
.hud p.facts{font-size:.84rem}
.facts b{color:var(--text)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pills.good span{border-color:color-mix(in srgb,var(--mint) 45%,var(--edge));background:color-mix(in srgb,var(--mint) 8%,transparent)}
.pills.bad span{border-color:color-mix(in srgb,var(--crit) 45%,var(--edge));background:color-mix(in srgb,var(--crit) 8%,transparent)}
.pills.bars2 span{border-color:var(--edge);background:none}
.pills.bars2 i{font-style:normal;font-size:.66rem;color:var(--faint);margin-right:3px}
.hud p.prose{font-family:var(--f-serif);font-size:1.02rem;line-height:1.45;color:var(--text)}
.ed{display:grid;gap:3px;min-width:0}
.ed textarea{font-family:var(--f-body);font-size:.84rem;line-height:1.4}
.hud p.settled{text-align:center;font-size:.7rem;color:var(--faint);font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.settled i{font-family:var(--f-serif);font-style:italic;font-size:1.05rem;color:var(--pink);text-transform:none;letter-spacing:0;margin-right:4px}
.settled span{display:block}
.dots{margin:0;padding-left:16px;display:grid;gap:3px;font-size:.8rem;color:var(--muted);line-height:1.4}
.hud.l .sheet{zoom:var(--zoomL,1)}
:root{--hudR:264px}
body.alone{--col:620px}
.clock.head{color:var(--text);font-weight:500}
.thought{padding:3px 12px}
.mcard.locked{opacity:.6;border-style:dashed}
.mcard.locked b i{color:var(--muted)}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--edge)}
.qrow b{display:block;font-size:.86rem;font-weight:600}
.qrow small{font-size:.68rem;color:var(--faint)}
.qrow.done b{color:var(--muted)}
.tagrow{display:grid;grid-template-columns:5rem minmax(0,1fr);gap:8px;align-items:start}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.thumb{padding:0;border-radius:10px;overflow:hidden;aspect-ratio:3/4;background:#000;border:1px solid var(--edge)}
.thumb.on{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink)}
.thumb img,.thumb video{display:block;width:100%;height:100%;object-fit:cover;object-position:center top}
.pot small{color:var(--faint);margin-left:4px}
:root{--col:560px;--hudR:300px}
body.alone{--col:700px}
.log::before{content:"";flex:1 0 0}
.ctabs{grid-column:1/-1;display:flex;gap:2px;border-bottom:1px solid var(--edge)}
.ctabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--faint);padding:4px 10px 5px;font-family:var(--f-mono);font-weight:500;font-size:.6rem;letter-spacing:.09em;text-transform:uppercase}
.ctabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--pink)}
.sheet-h{position:sticky;top:-14px;z-index:3;background:var(--box);padding:6px 0;justify-content:flex-start;align-items:center}
.sheet-h .lv{margin-left:auto}
.hud.l .rtabs{position:static}
.face{flex:none;display:block;width:56px;height:56px;border-radius:14px;overflow:hidden;border:1px solid var(--edge2);background:#000}
.face img,.face video{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 10%;transform:scale(1.9);transform-origin:50% 12%}
.around .roster .r small{font-size:.64rem;color:var(--faint)}
.backlog{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.backlog li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:7px;font-size:.8rem;color:var(--muted);line-height:1.4}
.backlog li span{color:var(--gold)}
.backlog small{display:block;font-family:var(--f-mono);font-size:.54rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.tok{flex:none;display:block;width:44px;height:44px;border-radius:10px;border:1px solid var(--edge2)}
.roster .r.foe-r{grid-template-columns:44px minmax(0,1fr);gap:9px;align-items:start}
.roster .r.foe-r .rb{display:grid;gap:3px;min-width:0}
.roster .r.foe-r small{font-family:var(--f-mono);font-size:.56rem;color:var(--faint);letter-spacing:.03em}
.line.has-face{padding-left:66px;min-height:72px}
.line .spk{position:absolute;left:11px;top:16px}
.line.her.has-face{border-top-right-radius:16px;border-top-left-radius:6px;align-self:flex-start}
.line.her.has-face .plate{left:66px;right:auto}
.foe-h{display:flex;gap:8px;align-items:center}
.foe .tok{width:34px;height:34px;border-radius:8px}
.halfcard{position:relative;height:150px;border-radius:14px;overflow:hidden;border:1px solid var(--edge);background:#07080c}
.halfcard .face{position:absolute;inset:0;width:auto;height:auto;border:0;border-radius:0;background:none}
.halfcard .face img,.halfcard .face video{transform:none;object-fit:cover;object-position:50% 14%}
.halfcard::after{content:"";position:absolute;inset:auto 0 0;height:62%;background:linear-gradient(transparent,rgba(8,9,13,.94));pointer-events:none}
.hc-name{position:absolute;left:12px;right:54px;bottom:9px;z-index:1}
.hc-name h2{margin:0;font-family:var(--f-head);font-weight:700;font-size:1.25rem;line-height:1.05;letter-spacing:-.01em}
.hc-name .role{margin:2px 0 0;font-family:var(--f-serif);font-style:italic;color:var(--pink);font-size:1.02rem;line-height:1.2}
.halfcard .lv{position:absolute;right:10px;top:10px;z-index:1;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--text);color:var(--ground);font-family:var(--f-head);font-weight:700;font-size:.85rem;box-shadow:0 0 0 2px var(--pink)}
@container (min-width:290px){.halfcard{height:250px}.hc-name h2{font-size:2.1rem}.hc-name .role{font-size:1.3rem}}
@container (min-width:460px){.halfcard{height:340px}}
/* ---------- v20: the portrait column, the vitals rail, the dice drawer, three panel sizes ---------- */
/* an RPG window: a gold hairline with a second line set inside it */
.composer{border-color:color-mix(in srgb,var(--gold) 42%,var(--edge2));box-shadow:inset 0 0 0 3px rgba(8,9,13,.55),inset 0 0 0 4px color-mix(in srgb,var(--gold) 20%,transparent)}
.hud{border-color:color-mix(in srgb,var(--gold) 26%,var(--edge));box-shadow:inset 0 0 0 3px rgba(8,9,13,.5),inset 0 0 0 4px color-mix(in srgb,var(--gold) 12%,transparent)}
.composer::before,.composer::after{content:"";position:absolute;top:-4px;width:7px;height:7px;rotate:45deg;background:var(--gold);box-shadow:0 0 8px -1px var(--gold);pointer-events:none}
.composer::before{left:14px}.composer::after{right:14px}
.cell.bubble{position:relative}
.cell.bubble:is(:hover,:focus-visible):not(:disabled)::before{content:"▸";position:absolute;left:3px;top:50%;translate:0 -50%;color:var(--gold);font-size:.7rem;line-height:1}
.cell.bubble.primary:is(:hover,:focus-visible)::before{color:var(--pink-ink)}
/* a bit bigger: the action grid, the right-hand info, her sheet */
#gridTravel,#rowsBattle,#rowsCombat{zoom:1.1}
.hud.r>*{zoom:1.08}
.hud.l .sheet{zoom:var(--zoomL,1.08)}
/* the dice drawer grows out of the top of the chat box */
.tray{display:block;margin:0 22px -9px;padding:0;border-radius:12px 12px 0 0;border:1px solid color-mix(in srgb,var(--gold) 42%,var(--edge2));border-bottom:0;background:var(--box2);position:relative;z-index:1;animation:trayUp .4s cubic-bezier(.2,.8,.2,1)}
.tray.offview,.foe.offview{display:none}
@keyframes trayUp{from{translate:0 100%;opacity:0}to{translate:0 0;opacity:1}}
.tray-h{display:flex;width:100%;align-items:center;gap:9px;padding:5px 10px;background:none;border:0;border-radius:12px 12px 0 0;color:inherit;text-align:left;cursor:pointer;font:inherit}
.tray-h .lbl{flex:1;min-width:0}
.die{flex:none;display:grid;place-items:center;width:28px;height:28px;font-family:var(--f-head);font-weight:700;font-size:.62rem;font-variant-numeric:tabular-nums;color:var(--ink);clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
.tray.roll .die{animation:dieSpin .8s cubic-bezier(.2,.8,.2,1)}
@keyframes dieSpin{from{rotate:-540deg;scale:.5}to{rotate:0deg;scale:1}}
.tray-b{display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s cubic-bezier(.2,.8,.2,1)}
.tray-in{min-height:0;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding:0 12px}
.tray-in .tray-m{padding-bottom:9px}
.tray.shut .tray-b{grid-template-rows:0fr}
.tray-h::after{content:"▾";font-size:.6rem;color:var(--faint)}
.tray.shut .tray-h::after{content:"▴"}
.foe{position:static;flex:none;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;padding:6px 12px;border-radius:12px}
.foe .track{margin:0;height:9px}
/* the big window */
.bigwrap{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(5,6,9,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.big-in{width:min(620px,100%);max-height:100%;overflow:auto;scrollbar-width:thin;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:20px 22px;border-radius:18px;background:var(--box2);border:1px solid color-mix(in srgb,var(--gold) 45%,var(--edge2));box-shadow:0 30px 80px -20px #000,inset 0 0 0 3px rgba(8,9,13,.55),inset 0 0 0 4px color-mix(in srgb,var(--gold) 20%,transparent);--c:var(--gold)}
.big-in h2{margin:0;font-family:var(--f-head);font-weight:600;font-size:1.35rem;letter-spacing:-.01em}
.big-in p{margin:0}
.big-in .prose{font-family:var(--f-serif);font-size:1.12rem;line-height:1.45}
.big-dice{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.big-in .over p{font-size:.86rem}
.big-in .vrows{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.line .info{margin-top:5px;padding:2px 10px;font-size:.66rem}
.hud.r .halfcard{position:relative;height:230px}
.shadeface{display:grid;place-items:center;background:#07080c}.shadeface svg{width:100%;height:100%}
#tray{position:absolute;z-index:11;left:calc(max(12px,env(safe-area-inset-left,0px)) + var(--hudL) + 12px);top:96px;width:clamp(210px,calc(50vw - var(--col)/2 - var(--hudMin) - 34px),320px);margin:0;border:1px solid color-mix(in srgb,var(--gold) 48%,var(--edge2));border-radius:12px;animation:none;box-shadow:0 18px 40px -16px #000,inset 0 0 0 3px rgba(8,9,13,.55)}
#tray .tray-h{border-radius:12px;cursor:grab;touch-action:none}
#tray.drag{opacity:.9}#tray.drag .tray-h{cursor:grabbing}
#tray .tray-h::before{content:"⠿";color:var(--faint);font-size:.7rem;margin-right:-3px}
.rlog{display:grid;gap:1px;padding:0 0 9px;border-top:1px solid var(--edge);padding-top:6px}
.rlog p{margin:0;font-family:var(--f-mono);font-size:.56rem;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rlog b{color:var(--muted);font-weight:500}
.top{flex-wrap:nowrap;gap:8px}
.mode{white-space:nowrap;flex:none}
.top .tabs{flex:none}
.top .title{flex:0 1 auto;min-width:0}
.top .title b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.topend{margin-left:auto;display:flex;gap:6px;flex:none}
.walkto{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px}
.walkto select{min-width:0;width:100%}
@media (max-width:1180px){.top{flex-wrap:wrap}}
.rfolds{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.rfold{border-top:1px solid var(--edge)}
.rfold>.fold{width:100%;justify-content:flex-start;padding:8px 0;text-align:left;white-space:normal}
.rfold.open>.fold{color:var(--text)}
.rfold>.over{border-top:0;padding-top:0;padding-bottom:10px}
.mapwrap{display:grid;gap:5px}
.maptop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bookbtn{padding:3px 9px;font-size:.66rem;background:var(--box2);border-color:color-mix(in srgb,var(--gold) 45%,var(--edge2));color:var(--gold);min-height:0}
.map .mk{font-size:4.4px;text-anchor:middle;stroke:var(--ground);stroke-width:.9px;paint-order:stroke;pointer-events:none}
.map .mk.job{fill:var(--mint);font-size:5px}.map .mk.bed{fill:var(--cyan)}.map .mk.shop{fill:var(--violet)}
.mapkey{display:flex;flex-wrap:wrap;gap:3px 10px;margin:0;font-family:var(--f-mono);font-size:.52rem;letter-spacing:.06em;text-transform:uppercase}
.mapkey span{color:var(--k)}
.bookrow{display:grid;gap:0;padding:6px 0;border-bottom:1px solid var(--edge)}
.bookrow b{color:var(--k);font-family:var(--f-head);font-weight:600;font-size:.9rem}
.bookrow span{font-size:.76rem;color:var(--muted)}
/* chat: sharp-cornered plates, one colour and one side per speaker; the Game Master's narration has no box at all */
.line{border-radius:5px;border-width:1px 1px 1px 4px;border-color:color-mix(in srgb,var(--c) 26%,var(--edge));border-left-color:var(--c);background:color-mix(in srgb,var(--box2) 88%,transparent);padding:15px 14px 10px}
.line.me{border-radius:5px;margin-right:9%;--c:var(--lc)}
.line.her{border-radius:5px;margin-left:9%;border-width:1px 4px 1px 1px;border-left-color:color-mix(in srgb,var(--c) 26%,var(--edge));border-right-color:var(--c);--c:var(--rc)}
.line.her.has-face{border-radius:5px;margin-left:0;margin-right:9%;border-width:1px 1px 1px 4px;border-left-color:var(--crit);border-right-color:color-mix(in srgb,var(--c) 26%,var(--edge))}
.line .plate{border-radius:3px;top:-10px;left:10px;letter-spacing:.01em}
.line.her .plate{right:10px}
.line.sys:not(.cap){align-self:stretch;max-width:100%;background:none;border:0;border-top:1px solid color-mix(in srgb,var(--gold) 38%,transparent);border-radius:0;backdrop-filter:none;-webkit-backdrop-filter:none;padding:14px 4px 4px;text-align:left}
.line.sys:not(.cap) .plate{left:0;top:-9px;background:var(--ground);color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);font-family:var(--f-mono);font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px}
.line.sys:not(.cap) .say{font-style:italic;color:color-mix(in srgb,var(--text) 86%,var(--gold));text-shadow:0 1px 8px rgba(0,0,0,.85)}
.line.sys:not(.cap) .dice{text-shadow:0 1px 6px rgba(0,0,0,.9)}
.line.cap{border-left-width:2px;text-shadow:0 1px 6px rgba(0,0,0,.9)}
.log{background:linear-gradient(180deg,transparent,rgba(6,7,10,.34) 30%,rgba(6,7,10,.46));border-radius:10px;padding-left:8px;padding-right:8px}
.goal{margin:0;font-size:.82rem;color:var(--muted)}.goal b{color:var(--faint);margin-right:4px}.goal.ok{color:var(--text)}.goal.ok b{color:var(--mint)}.goal span{font-size:.7rem;color:var(--faint);margin-left:4px}
/* the four sizes: a thin strip under her bars */
.rail .sizes{position:static;opacity:1;display:flex;gap:1px;margin-top:6px;padding:1px;border-radius:6px;background:var(--glass);border:1px solid var(--edge)}
.rail .sizes button{flex:1;padding:1px 2px;font-size:.44rem;border-radius:4px}
#gridTravel,#rowsBattle,#rowsCombat{zoom:1}
.composer{border-radius:8px;padding:9px 10px;gap:6px}
.cell,.cell.bubble{border-radius:4px;padding:5px 9px 5px 11px;min-height:38px;border-left-width:3px;border-left-color:var(--edge2)}
.cell b{font-size:.8rem}.cell small{font-size:.64rem;line-height:1.25}
.cell.bubble.primary{border-left-color:var(--pink-ink)}
.cell.spot{border-left-color:var(--cyan)}.cell.go{border-left-color:var(--edge)}
.cell.empty{min-height:38px}
.pgrid,.grid{gap:4px}
.exits button{border-radius:4px;padding:3px 9px;font-size:.72rem}
.composer .say,#say{border-radius:4px}
.foe{border-radius:6px}
#tray.docked{position:static;width:auto;left:auto;top:auto;box-shadow:none;margin:0 0 2px}
#tray.docked .tray-h{cursor:grab}
.trayhome{position:absolute;right:26px;top:6px;padding:1px 7px;font-size:.5rem;min-height:0;text-transform:uppercase;letter-spacing:.08em}
#thought{position:absolute;z-index:4;left:calc(var(--hudMin) + 22px);top:38%;width:clamp(170px,calc(50vw - var(--col)/2 - var(--hudMin) - 30px),300px);margin:0;padding:8px 12px 9px;border-left:0;border-radius:12px 12px 12px 2px;background:color-mix(in srgb,var(--box2) 94%,transparent);border:1px solid color-mix(in srgb,var(--lc) 42%,var(--edge2));box-shadow:0 10px 26px -14px #000;transition:top .25s}
#thought::after{content:"";position:absolute;left:18px;bottom:-7px;width:12px;height:12px;rotate:45deg;background:inherit;border-right:1px solid color-mix(in srgb,var(--lc) 42%,var(--edge2));border-bottom:1px solid color-mix(in srgb,var(--lc) 42%,var(--edge2))}
#thought i{font-size:.92rem;line-height:1.3;display:block}
body.walking #thought{opacity:0}
.tpop{position:absolute;z-index:5;max-width:230px;padding:6px 11px 7px;border-radius:11px 11px 11px 2px;background:color-mix(in srgb,var(--box2) 95%,transparent);border:1px solid color-mix(in srgb,var(--k) 55%,var(--edge2));font-family:var(--f-serif);font-style:italic;font-size:.9rem;line-height:1.25;color:var(--text);pointer-events:none;box-shadow:0 10px 24px -14px #000;animation:tpop 5.2s ease forwards;--k:var(--lc)}
body.popping #thought{opacity:0}
.hud p.mapkey{font-size:.5rem}
.tpop.c1{--k:var(--gold)}.tpop.c2{--k:var(--pink)}
@keyframes tpop{0%{opacity:0;translate:0 10px;scale:.92}8%{opacity:1;translate:0 0;scale:1}82%{opacity:1;translate:0 -14px}100%{opacity:0;translate:0 -26px}}
@media (prefers-reduced-motion:reduce){.tpop{animation:tpopStill 5.2s linear forwards}}
@keyframes tpopStill{0%,90%{opacity:1}100%{opacity:0}}
/* Amaranth is an apparition: her clip has a white ground, so she arrives in a soft-edged halo */
.sprite video.ghost,.sprite img.ghost{-webkit-mask-image:radial-gradient(ellipse 56% 62% at 50% 52%,#000 58%,transparent 82%);mask-image:radial-gradient(ellipse 56% 62% at 50% 52%,#000 58%,transparent 82%);object-position:50% 100%;filter:drop-shadow(0 0 28px rgba(199,125,255,.55))}
.sprite.r:has(.ghost){height:80%;left:calc(50% + var(--col)/2 - 150px);right:calc(var(--hudR) - 10px)}
.sprite video.ghost,.sprite img.ghost{object-fit:cover;object-position:50% 22%}
body.dream .scene img{filter:brightness(.32) saturate(1.5) hue-rotate(250deg)!important;opacity:.9}
body.dream .scene::after{background:radial-gradient(120% 90% at 70% 40%,rgba(120,40,170,.38),rgba(8,5,14,.82));height:100%;inset:0}
body.dream .sprite.l{filter:brightness(.72) saturate(.8)}
.cthumb video{object-position:50% 20%}
.chat-l{margin:0;font-size:.82rem;color:var(--muted);line-height:1.4}
.chat-l b{color:var(--text);font-weight:600}
.chat-l i{font-family:var(--f-mono);font-style:normal;font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
body.slim .hud.l .folds,body.slim .hud.l .foldbox,body.slim .hud.l .sheet-body,body.slim .hud.l .lookpick{display:none}
@keyframes idleShift{0%,100%{transform:translateY(0) scaleY(1) rotate(0deg)}30%{transform:translateY(-.5%) scaleY(1.014) scaleX(1.005) rotate(.25deg)}65%{transform:translateY(.1%) scaleY(1.004) rotate(-.2deg)}}
body.sway .sprite>*{animation:idleShift 5.2s ease-in-out infinite}
body.sway .sprite.r>*{animation-duration:6.1s;animation-delay:-2s}
body.walking .sprite>*{animation:none}
/* the catalogue */
.castwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.castwrap h3{margin:8px 0 0;font-family:var(--f-mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:500}
.cnote{margin:0;font-size:.8rem;color:var(--muted)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.ccard{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:start;padding:9px;border-radius:12px;background:var(--box2);border:1px solid var(--edge)}
.ccard.main{border-color:color-mix(in srgb,var(--gold) 45%,var(--edge))}
.ccard.unmet{opacity:.62;border-style:dashed}
.cthumb{position:relative;width:64px;height:84px;border-radius:9px;overflow:hidden;background:#07080c;border:1px solid var(--edge);display:grid;place-items:center}
.cthumb img,.cthumb video{width:100%;height:100%;object-fit:cover;object-position:50% 10%;display:block}
.cthumb .face{position:absolute;inset:0;width:auto;height:auto;border:0;border-radius:0}
.cthumb .shade{width:100%;height:100%}
.ccard b{display:block;font-family:var(--f-head);font-weight:600;font-size:.86rem;line-height:1.15}
.ccard i{display:block;font-family:var(--f-serif);color:var(--pink);font-size:.98rem;line-height:1.2;margin-bottom:3px}
.ccard p{margin:0;font-size:.72rem;color:var(--muted);line-height:1.35}
.pinnote{grid-column:1/-1;font-family:var(--f-mono);font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;color:var(--crit)}
/* the same grid at every place: three rows of four */
.pgrid{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.prow{grid-column:1/-1;font-family:var(--f-mono);font-size:.5rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:2px}
.prow:first-child{margin-top:0}
.cell.empty{border:1px dashed var(--edge);background:none;min-height:44px;opacity:.45}
body.sheetL .pgrid,body.half .pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
body.sheetL .cell.empty,body.half .cell.empty{display:none}
#gridTravel{max-height:50vh;overflow-y:auto;scrollbar-width:thin;align-content:start}
/* roads on the map bend once per stretch */
.map polyline{fill:none;stroke:var(--edge2);stroke-width:.8;stroke-dasharray:1.6 1.4;stroke-linejoin:round}
.map polyline.on{stroke:var(--c);stroke-dasharray:none}
.map polyline.wild{stroke:color-mix(in srgb,var(--crit) 55%,transparent)}
.map polyline.on.wild{stroke:var(--c)}
.map .jt{fill:var(--edge2)}.map .jt.wild{fill:color-mix(in srgb,var(--crit) 70%,transparent)}.map .jt.on{fill:var(--c)}
.roads{display:grid;gap:4px}
.roadrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;align-items:center;text-align:left;padding:6px 10px;border-radius:10px;background:var(--glass);border:1px solid var(--edge);min-height:0}
.roadrow:hover{border-color:var(--edge2)}
