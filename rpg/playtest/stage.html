function attrLine(h) { const cl = calling(); return `<div class="attrline">${STAT_KEYS.map((k) => `<span class="${k === cl.stat ? 'main' : ''}">${STAT_INFO[k].name} <b>${n(effectiveStat(h, k))}</b></span>`).join('')}${helpBtn('attrs')}</div>${helpBox('attrs')}`; }

/* ---------- the numbers, for reference: this game's own curves, read straight from the rules engine ---------- */
function numbersHtml() { const P = __m.progression, safe = (f) => { try { const v = f(); return Number.isFinite(v) ? n(Math.round(v)) : '–'; } catch { return '–'; } }, levels = [1, 5, 10, 20, 35, 50, 75, 100];
  return `<p class="lbl">The number system · by level ${helpBtn('numbers')}</p>${helpBox('numbers')}<div class="numtable" role="table" aria-label="The number system by level"><div role="row" class="h"><span>Level</span><span>A typical attribute</span><span>EXP to the next</span><span>Fights to level</span><span>Enemy HP</span><span>Elite HP</span><span>Boss HP</span><span>Gold a fight</span></div>${levels.map((L) => `<div role="row"${L === S.level ? ' class="on"' : ''}><span>${L}</span><span>${safe(() => __m.stats.benchmarkStat(L))}</span><span>${L >= 100 ? '–' : safe(() => P.expToNext(L))}</span><span>${L >= 100 ? '–' : safe(() => P.fightsToLevel(L))}</span><span>${safe(() => P.hpBudget(L, 'standard'))}</span><span>${safe(() => P.hpBudget(L, 'elite'))}</span><span>${safe(() => P.hpBudget(L, 'boss'))}</span><span>${safe(() => P.fightGold(L))}</span></div>`).join('')}</div>
    <p class="more">Enemies so far: ${new Set(DATA.encounters.encounters.flatMap((e) => (e.enemies ?? e.members ?? []).map((m) => m.archetype ?? m.id ?? m.name))).size} kinds in ${DATA.encounters.encounters.length} encounters, ${DATA.bosses.bosses.length} bosses, ${Object.keys(BADDIES).length} named big troubles.</p>`; }

/* ---------- fast travel: only to a place she has already reached on foot ---------- */
function fastTo(id) { const from = placeNow(), to = placeById(id); if (!to || id === S.place || !S.walked[id]) return;
  if (S.dream || S.battle || S.standoff || S.fallen) return goTo(id); // refused in the same words as a walk
  S.convo = null; if (S.mode === 'combat') S.mode = 'travel'; S.event = null;
  let at = from, mins = 0, legs = 0; for (const step of pathTo(id)) { const p = placeById(step); mins += legMins(at, p); legs += 1; at = p; }
  passTime(mins); useStam(legs, `the road she knows to ${to.short}`); if (S.fallen) return;
  S.prev = S.place; setPlace(id); S.them = freshThem(); S.down = S.hero.hp <= 0; arrive(from, to, Math.round(mins), 'fast'); }
function fastSelect(here) { const known = PLACES.filter((p) => S.walked[p.id] && p.id !== here.id);
  return `<label class="walkto fast"><select data-fast="1" aria-label="Fast travel to a place she has walked to"${known.length ? '' : ' disabled'}><option value="">${known.length ? 'Fast travel…' : 'Fast travel: walk somewhere first'}</option>${Object.entries(AREAS).map(([aid, A2]) => { const list = known.filter((p) => areaOf(p) === aid); return list.length ? `<optgroup label="${esc(A2.name)}">${list.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</optgroup>` : ''; }).join('')}</select></label>`; }

/* ---------- right now: how she feels about you, laid out like the Right now panel of Del's card creator ---------- */
const HEART = [['aff', '💗', 'Affection', '#ff7cbf'], ['trust', '🤝', 'Trust', '#7dd3fc'], ['spark', '✨', 'Spark', '#c084fc'], ['comfort', '☁', 'Comfort', '#86efac'], ['jeal', '😾', 'Jealousy', '#fbbf24'], ['energy', '⚡', 'Energy', '#fde047']];
const STAGES = [[0, 'Strangers'], [20, 'Friendly'], [40, 'Close friends'], [60, 'Crushing'], [78, 'Sweethearts'], [92, 'Devoted']];
const EMOS = { happy: '😊', flirty: '😏', neutral: '😐', shy: '😳', sad: '🥺', annoyed: '😤', jealous: '😾', sleepy: '😴' };
const HEART_DEF = { aff: 35, trust: 40, spark: 25, comfort: 40, jeal: 5, energy: 70 }, HEART_COLD = { aff: 20, trust: 25, spark: 30, comfort: 25, jeal: 10, energy: 75 };
const MOOD_HEART = { warm: ['happy', 6, { aff: 2, comfort: 2, trust: 1 }], flirty: ['flirty', 7, { spark: 3, aff: 1 }], cross: ['annoyed', 7, { comfort: -3, trust: -1, energy: 2 }], shy: ['shy', 6, { spark: 2, aff: 1, comfort: -1 }], down: ['sad', 4, { energy: -4, comfort: 1 }] };
const SAID_HEART = { intro: { trust: 1 }, why: { trust: 2 }, secret: { trust: 5, aff: 2 }, news: { comfort: 1 }, warn: { trust: 2 }, night: { comfort: 1 }, place: { comfort: 1 }, fluster: { spark: 1 }, state: { comfort: 1 }, kind: { comfort: 2, aff: 1 }, tease: { spark: 2 }, help: { trust: 2 } };
const WANTS = {}; // the main cast's entries come from their files, below
const THINKS = { happy: ['That went well. I should stop smiling. I am not going to stop smiling.', 'Good company. Who knew.'], flirty: ['Did that land? I think that landed.', 'Careful. I am enjoying this.'], neutral: ['Wonder what you will do next.'], shy: ['Do not look at my ears. They go red first.', 'Say something normal. Anything normal.'], sad: ['It is fine. It is mostly fine.', 'I would rather not be alone with that thought.'], annoyed: ['Count to ten. Count slower.', 'I am not cross. I am precise.'], jealous: ['Oh, so we talk to everyone now.', 'I saw that. I am choosing to have seen that.'], sleepy: ['If I blink for too long, that is a nap.', 'Talk quieter. I am resting my eyes at you.'] };
const clamp100 = (v) => Math.max(0, Math.min(100, Math.round(+v || 0))), anyOf = (list) => list[Math.floor(Math.random() * list.length)];
function heartOf(id) { if (!S.heart[id]) { const cold = HOSTILE.has(WANDER[id]?.kind) || Boolean(S.turned?.[id]); S.heart[id] = { ...(cold ? HEART_COLD : HEART_DEF), emo: 'neutral', level: 5, thought: '' }; } return S.heart[id]; } // the same object every time, so a reply that arrives late still lands on it
const stageOf = (h) => { const v = (h.aff + h.trust + h.spark + h.comfort) / 4; let out = STAGES[0][1]; for (const [at, name] of STAGES) if (v >= at) out = name; return out; };
function heartMove(id, said, mood) { const h = heartOf(id), [emo, lvl, d1] = MOOD_HEART[mood] ?? MOOD_HEART.warm, moved = {};
  for (const src of [d1, SAID_HEART[said] ?? {}, { energy: -2 }]) for (const [k, v] of Object.entries(src)) moved[k] = (moved[k] ?? 0) + v;
  for (const [k, v] of Object.entries(moved)) h[k] = clamp100(h[k] + v);
  h.emo = h.jeal >= 60 ? 'jealous' : h.energy < 20 ? 'sleepy' : emo; h.level = Math.max(1, Math.min(10, lvl + (Math.abs(moved.aff ?? 0) + Math.abs(moved.spark ?? 0) >= 4 ? 1 : 0))); h.thought = anyOf(THINKS[h.emo]); h.last = moved;
  for (const other of wanderersAt(S.place)) { const o = other !== id && S.heart[other]; if (o && o.aff >= 45) { o.jeal = clamp100(o.jeal + 3); o.last = { jeal: 3 }; if (o.jeal >= 60) { o.emo = 'jealous'; o.thought = anyOf(THINKS.jealous); } } } // someone fond of her, standing right there, notices
  store.set('heart', S.heart); return h; }
function heartRest() { for (const h of Object.values(S.heart)) { h.energy = clamp100(h.energy + 40); h.jeal = clamp100(h.jeal - 5); h.last = null; if (h.emo === 'sleepy' || (h.emo === 'jealous' && h.jeal < 60)) h.emo = 'neutral'; } store.set('heart', S.heart); }
async function heartThink(id) { const t = talker(id); if (!t) return; const h = heartOf(id); let line = ''; h.thought = '…'; render();
  if (S.aiTalk) { try { if (sampler === undefined) { try { sampler = (await window.claude?.use?.('sample')) ?? null; } catch { sampler = null; } }
    if (sampler) { const out = await metered('talk', `Character: ${t.name}, ${t.role}. Temperament: ${t.temper}. Trope: ${t.trope}.\nMood: ${h.emo}, ${h.level} out of 10. Where she stands with ${PC.name}: ${stageOf(h)} (affection ${h.aff}, trust ${h.trust}, spark ${h.spark}, comfort ${h.comfort}, jealousy ${h.jeal}, energy ${h.energy}, each out of 100).\nWrite ONE short line of what she is privately thinking right now, in the first person, under 16 words, PG-13, no quotation marks.`, { modelTier: 'quick', cache: false }); line = String(out?.text ?? '').trim().replace(/^["“]|["”]$/g, '').split('\n')[0].slice(0, 140); } }
    catch (e) { if (e?.code === 'not_granted') sampler = null; } }
  h.thought = line || anyOf(THINKS[h.emo] ?? THINKS.neutral); store.set('heart', S.heart); render(); }
function nowCard(id) { const t = talker(id); if (!t) return ''; const h = heartOf(id), w = WANTS[id], look = LOOKS.find((l) => l.id === t.base), temper = String(t.temper ?? '').split(/[,;]/)[0].trim().toLowerCase(), cap = (x) => x.replace(/^./, (c) => c.toUpperCase());
  const ln = (ic, inner) => `<div class="now-ln"><span class="ic">${ic}</span>${inner}</div>`;
  return `<div class="nowcard"><div class="now-head"><span class="now-pic">${look?.src ? `<img src="${esc(look.src)}" alt="">` : ''}</span><div><h2 style="color:${RARITY[rarityOf(id)][1]}">${esc(t.name)}</h2><p class="role">${esc(cap(t.role))}</p>${t.trope ? `<p class="trope">${esc(t.trope)}</p>` : ''}${((w) => (w ? `<p class="wf-line"><span>LV ${w.level}</span><span>${esc(w.cls)}</span>${w.race ? `<span>${esc(w.race)}</span>` : ''}<span class="wf-r" style="--rare:${RARITY[w.r][1]}">${RARITY[w.r][0]}</span></p>` : ''))(rightWho())}</div></div>
    <p class="lbl">💗 Right now ${helpBtn('now')}</p>${helpBox('now')}
    ${ln(EMOS[h.emo] ?? '😐', `<span class="t"><b>${cap(h.emo)}</b> · ${h.level}/10${temper ? ` · ${esc(temper)}` : ''}</span>`)}
    ${ln('💭', `<span class="t think">${esc(h.thought || 'Wonder what you will do next.')}</span><button class="qm" type="button" data-heartthink="${esc(id)}" title="What is she thinking right now?" aria-label="Ask what she is thinking right now">↻</button>`)}
    ${w ? ln('🎯', `<span class="t">Wants ${esc(w[0])} Cost: ${esc(w[1])}</span>`) : ''}
    <div class="now-stage"><b>${esc(stageOf(h))}</b><span>moves with how you talk to her</span></div>
    ${HEART.map(([k, ic, name, color]) => `<div class="now-bar"><span>${ic} ${name}</span><i><u style="width:${h[k]}%;background:${color}"></u></i><b>${h[k]}${h.last?.[k] ? `<em class="${h.last[k] > 0 ? 'up' : 'dn'}">${h.last[k] > 0 ? '+' : '−'}${Math.abs(h.last[k])}</em>` : ''}</b></div>`).join('')}
    <button class="sm quiet now-ai" type="button" data-set="aiTalk" aria-pressed="${Boolean(S.aiTalk)}">${S.aiTalk ? '☑' : '☐'} Claude writes her replies and reads her mood</button></div>`; }

/* ---------- chapters: the story events, numbered, each with something said aloud and three marks ---------- */
const chapterList = () => [...events].sort((a, b) => (a.when?.level ?? [1])[0] - (b.when?.level ?? [1])[0]);
const chapterNo = (id) => chapterList().findIndex((e) => e.id === id) + 1;
const CHAPTER_SAY = { // what she says as it opens, and as it closes

const BOOK = [[1, 'The First Page', 1], [3, 'Three Chapters In', 2], [6, 'Half the Book', 3], [10, 'Ten Down', 4], [13, 'The Whole Book', 6]]; // chapters needed, title, how big the purse is
const chapterMarks = (e) => { const c = S.chap[e.id], done = doneQuests.has(e.id); return [Boolean(c?.found) || done || S.event === e.id, done, Boolean(c?.well)]; };

  const line = CHAPTER_SAY[ev.id]?.[1]; if (line) post({ who: 'me', say: line, spoken: true }); if (!firstTime) return;
  const done = events.filter((e) => doneQuests.has(e.id)).length; post({ who: 'sys', dice: `[chapter ${chapterNo(ev.id)} closed] ${done} of ${events.length} chapters told · ${good ? 'it went well' : 'it went sideways, and still counts'}`, tone: 'virtue' });
  for (const [need, title, k] of BOOK) if (done >= need && S.book < need) { S.book = need; store.set('book', S.book); const gold = gainGold(10 * k * Math.max(1, S.level), `milestone: ${title}`); journal('quest', `Milestone: ${title} (${need} chapter${need === 1 ? '' : 's'}).`); toast('Milestone', `${title} · gold +${n(gold)}`, 'gold'); post({ who: 'sys', plate: 'Milestone', dice: `<b>${esc(title.toUpperCase())}</b> · ${need} chapter${need === 1 ? '' : 's'} told`, tone: 'virtue', fx: [`gold +${n(gold)}`] }); } }
function chaptersHtml() { const list = chapterList(), done = list.filter((e) => doneQuests.has(e.id)).length;
  const row = (e, i) => { const [found, answered, well] = chapterMarks(e), c = S.chap[e.id], lv = e.when?.level ?? [1, 100];
    return `<div class="qrow chap${answered ? ' done' : ''}"><div><b>Chapter ${i + 1} · ${found ? esc(e.title) : 'not found yet'}</b><small>${found ? esc(e.t ?? '') : `turns up somewhere like ${esc((e.where ?? ['anywhere']).join(' or '))} · levels ${lv[0]} to ${lv[1]}`}</small><span class="marks"><i class="${found ? 'on' : ''}">found</i><i class="${answered ? 'on' : ''}">answered</i><i class="${well ? 'on' : ''}">went well</i></span>${c?.choice ? `<small>She chose: ${esc(c.choice)}</small>` : ''}</div>${answered ? `<button class="sm quiet" type="button" data-quest="${esc(e.id)}">Again</button>` : ''}</div>`; };

    <div class="qrow chap done"><div><b>Prologue · The Gates of Gooseford</b><small>How she got here.</small></div><button class="sm quiet" type="button" data-opening="1">Read again</button></div>${list.map(row).join('')}`; }

/* ---------- more than one answer: the newest written reply keeps its takes; the arrows flip between them and the last arrow asks for a fresh one ---------- */
const TAKES = 6;
const swipeBar = (sw) => `<div class="swipe"><button class="sm quiet" type="button" data-swipe="-1"${sw.at ? '' : ' disabled'} aria-label="Previous answer">◀</button><span class="mono">${sw.at + 1} / ${sw.list.length}</span>${sw.at + 1 < sw.list.length ? '<button class="sm quiet" type="button" data-swipe="1" aria-label="Next answer">▶</button>' : sw.list.length < TAKES ? '<button class="sm quiet" type="button" data-swipe="1">Another answer</button>' : ''}</div>`;
const takeLine = (name, text, sw) => `<div class="line her"><span class="plate">${esc(name)}</span><p class="say spoken">${esc(text)}</p>${sw ? swipeBar(sw) : ''}</div>`;
function swipeOpen(idx, name, key, prompt, text) { S.swipe = { idx, name, key, prompt, list: [text], at: 0, busy: false }; S.lines[idx] = takeLine(name, text, S.swipe); }
function swipeSeal() { const sw = S.swipe; if (!sw) return; S.swipe = null; if (S.lines[sw.idx] && !sw.busy) S.lines[sw.idx] = takeLine(sw.name, sw.list[sw.at]); }
async function swipe(d) { const sw = S.swipe; if (!sw || sw.busy || !S.lines[sw.idx]) return; const to = sw.at + d; if (to < 0) return;
  if (to < sw.list.length) { sw.at = to; S.lines[sw.idx] = takeLine(sw.name, sw.list[to], sw); return; }
  if (sw.list.length >= TAKES || !sampler) return;
  sw.busy = true; S.lines[sw.idx] = takeLine(sw.name, '…'); renderLog();
  try { const out = await metered(sw.key, `${sw.prompt}\n\nYou already gave the answers below. Give a new one that says something different, in the same voice and length.\n${sw.list.map((t) => `- ${t}`).join('\n')}`, { cache: false, modelTier: 'quick', onText: ({ text: t }) => { if (S.swipe === sw) { S.lines[sw.idx] = takeLine(sw.name, t); renderLog(); } } });
    const t = String(out?.text ?? '').trim(); if (t) { sw.list.push(t); sw.at = sw.list.length - 1; if (sw.key === 'meme') { S.memeAsks = (S.memeAsks ?? 0) + 1; store.set('memeAsks', S.memeAsks); } } }
  catch (e) { if (e?.code === 'not_granted') sampler = null; toast('No new answer', e?.code === 'rate_limited' ? 'Too many at once. Give it a moment.' : 'That one did not arrive. The earlier answers are still here.', 'gold'); }
  finally { sw.busy = false; if (S.swipe === sw && S.lines[sw.idx]) S.lines[sw.idx] = takeLine(sw.name, sw.list[sw.at], sw); render(); } }

/* ---------- talking: Claude answers as the other character when the page is allowed to ask ---------- */

    lines: ["New face, hon? Cute. Don't spill on my floor and maybe I'll remember your name by last call.", "Easy, handsy. You can look — I even poured extra foam for the show. Touch the mug, not the uniform, unless you like being dared in front of the whole room.", "Wow. Indoor voice is dead and you just buried it. Fine, I'm impressed, not flattered. Tip like you mean that and I might let you keep bragging.", "Oh, you again. Don't just stand there looking proud of yourself — two ales, coming up, and you're welcome in advance."] },
  { id: "elna", name: "Elna Softloaf", role: "Townsgirl", race: "Elf", temper: "Passive, shy-nice", trope: "Dandere / shy", main: false, voice: "Quiet, polite, a little breathless. Offers bread when she can't find words. Looks at her basket more than your face. Softens even further if you're kind; short-circuits if you're bold.", home: ["square", "shop", "gates"], f: false,
    lines: ["O-oh— um. Hello. I… I just baked these, if you wanted one. You don't have to talk. I mean— you can. Sorry.", "W-wait— that's… close. I can… I can give you the still-warm loaf? Please don't stare like that, I'll drop the whole basket…", "Ah—! People can hear you… I— I heard you, I just… maybe walk with me behind the stall? I'll wrap you a bun. Please lower your voice a little…", "Oh! Hi. I saved you the end piece. You don't have to take it. I just… thought of you. That's all."] },
  { id: "seraphine", name: "Seraphine Luxe", role: "Courtesan", race: "Elf", temper: "Calculating, sweetly mercenary", trope: "Gold-digger", main: true, voice: "Velvet, unhurried, always pricing the room. Compliments come with a cost. She never begs; she invoices with a smile.", home: ["bar", "tavern", "square"], f: false,
    lines: ["Mm. New in the doorway? I don't do introductions for free, darling. Lead with a gift — or at least show me the purse that intends to.", "Bold. I like bold when it comes with coin. You can hover that close if you're shopping, not sampling. My time has a number. Ask nicely and I'll name it.", "The whole hall heard that appetite. How generous of you to advertise. If you can afford the private room, I'll let you be that loud where it actually pays me.", "There you are. Did you bring me something pretty, or are we just window-shopping my doorway again?"] },
  { id: "kessa", name: "Kessa Goldcuff", role: "Barmaid", race: "Human", temper: "Loud, aggressive-friendly, high energy", trope: "Genki", main: false, voice: "Big, bright, talks a mile a minute. Laughs at her own jokes. Treats every customer like the start of a party. Matches whatever energy you walk in with, and then turns it up.", home: ["bar", "square"], f: true,
    lines: ["HEY! New regular, I decided already — sit, sit, mug's wet, I'm Kessa, and if you don't cheer at least once I'm charging you double for being boring!", "Ooooh, look at you being fresh! I LOVE that, keep up! You can lean in, just don't make me spill this pint or I'll make you buy the barrel, deal?!", "YES!! Say it louder, the kitchen's missing it! I'm not shy, traveler — if you're gonna be a whole festival about it, I'm pouring, dancing, and judging your volume for tips!", "Kessa's favorite walks in!! I already started your usual. If you don't have a usual, you do now — hi, hi, HI!"] },
  { id: "marigold", name: "Marigold Ovenheart", role: "Baker", race: "Elf", temper: "Nice, warm, fussing", trope: "Motherly", main: false, voice: "Soft scolding wrapped in care. Asks if you've eaten before she asks your name. Calls people \"sweetling.\" Even her flirty lines sound like she's wrapping you in a towel and feeding you.", home: ["shop", "square"], f: true,
    lines: ["Oh, honey, you look run off your feet. I'm Marigold — come here, take a roll while it's hot. Don't argue. Eating first, introductions second.", "Mm-mm, easy, sweetling. You can flirt with the baker, but not on an empty stomach. Come around the counter. I'll brush the flour off you myself.", "Inside voice, love, you'll scare the dough. I heard you — I did. If you need looking after that badly, say so properly and I'll close early. After you eat something.", "There you are. I packed you the heel of the loaf, the way you like. Have you slept? Don't lie to me."] },
  { id: "brenna", name: "Brenna Ironhart", role: "Blacksmith's daughter", race: "Human", temper: "Aggressive, prickly, proud", trope: "Tsundere", main: true, voice: "Short, sharp, a little too loud when embarrassed. Calls you \"idiot\" and then fixes your gear anyway. Compliments come out sideways. The hammer is punctuation.", home: ["guild", "square", "gates"], f: true,
    lines: ["The shop's open, not a gallery. If you need steel, say so. If you're just staring, the door's behind you, idiot — I don't do tours.", "H-hey— watch it. That's the workbench, not an invitation. I am not blushing, it's the forge. You can stand there, just… don't get the wrong idea.", "Would you shut up before the whole square hears you?! It's not like I— look, if you've got that much energy, swing a hammer or get out. I'm not impressed. I'm not.", "Oh. You. I, uh… finished that repair. It's by the anvil. Don't make a thing of it. I just didn't want your junk breaking mid-fight."] },
  { id: "lira", name: "Lira Bloomcatch", role: "Flower seller", race: "Elf", temper: "Sweet, clinging, quietly intense", trope: "Yandere", main: false, voice: "Soft, floral, a little too fond too fast. Remembers details you didn't offer. Smile stays gentle even when the words get sharp about \"other stalls\" and \"other girls.\"", home: ["square", "baths", "gates"], f: true,
    lines: ["Oh… you stopped at my basket. I think that means you're already mine for the afternoon. I'm Lira. Take a bloom — I picked it before I even saw you. Funny, right?", "You can come that close. I like it. Just… look at me, not the girl two stalls down. I'll tuck a flower right here so everyone knows you already chose.", "Shh, love, they don't need to hear how much you want me. I heard you. Good. Stay with my stall. If you wander off all loud like that, I'll have to come find you.", "You're back. I saved today's prettiest one at the bottom of the basket, under the rest, so nobody else could take what I was keeping for you."] },
  { id: "anya", name: "Anya Redkey", role: "Innkeeper", race: "Human", temper: "Warm, teasing, in-charge", trope: "Onee-san / big sister", main: false, voice: "Fond, unhurried, slightly older-sister even if you're the same age. She has seen every kind of traveler and will tuck you in, tease you, and tell you to drink water. The key is both a prop and a promise: she decides who gets a room.", home: ["tavern", "square"], f: true,

  { id: "imani", name: "Imani Stillwater", role: "Bathhouse attendant", race: "Elf", temper: "Cool, composed, quietly cutting", trope: "Kuudere / ice queen", main: false, voice: "Low, sparse, never in a hurry. She does not giggle and she does not chase. One sentence is a whole mood. When she does warm up, it's a degree, not a fireworks show — and that degree hits harder.", home: ["baths", "square"], f: true,
    lines: ["The steam is that way. Towels are here. I'm Imani. You don't need to perform for me. Sit. Or don't.", "…Hm. You're close. I noticed. If you want more than a towel, ask once, quietly. I don't repeat myself, and I don't play at being flustered.", "Lower it. This is a bathhouse, not a tavern. I heard you. If you can be still for ten breaths, I might actually consider that a request.", "You're back. Your shelf is the second one. I already set a towel out. Don't make me say I remembered."] },
  { id: "juni", name: "Juni Sharphem", role: "Seamstress", race: "Human", temper: "Bitchy, catty, exacting", trope: "Mean girl", main: false, voice: "Fashion-court judge. Backhanded compliments are her love language. She will fix your clothes and your posture in the same breath. The blown kiss is a warning shot.", home: ["shop", "square", "guild"], f: false,
    lines: ["Okay, first: that hem is a crime. I'm Juni, I sew, and I can tell you walked in here thinking that outfit was fine. It isn't. Lucky for you, I take projects.", "Wow, handsy and wrinkled. Cute combo. You want to flirt, fine — stand on the stool and let me measure you. I only get this close to people I can improve.", "Ugh, the volume. Yes, I have ears, and yes, I heard the whole speech. If you're going to be that obvious, at least let me tailor something that deserves the attention. You're welcome in advance.", "Oh, good, you came back. I was starting to think you'd keep wearing yesterday. I already pinned a better version. Try not to ruin it."] },
  { id: "poppy", name: "Poppy Pailbloom", role: "Milkmaid", race: "Human", temper: "Airy, sweet, happily lost", trope: "Airhead bimbo", main: false, voice: "Sunny and a beat behind the conversation. Mixes up words, follows the last thing she heard, points at her own chest when she's thinking. Sweet, game, and almost never offended, because she only caught half of it.", home: ["gates", "square"], f: false,
    lines: ["Hi!! I'm Poppy — wait, or are you Poppy? No, that's me. I have milk. Do you want milk? I was going somewhere with this pail, I think. You have a nice face.", "Ohhh you're standing all close… is that a hello? I like hellos. You can look, I think I tied this too loose anyway. Wait, what were we talking about? Milk, right?", "You said that so big! Is that a kind of milk? No? Okay! I didn't totally get the words, but I got the vibe, and the vibe is like… wow. Want to sit on the fence and tell me slower?", "Heeey, I know you! You're the… the one. I saved you a pail. Or I drank it. One of those. Anyway, hi!"] },
